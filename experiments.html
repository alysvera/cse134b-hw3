      <h2>video tag</h2>
      <video controls width="200">

      </video>
    </section>

    <section>
      <h2>audio tag</h2>
      <audio controls src="https://cdn.pixabay.com/download/audio/2026/04/13/audio_9bee257339.mp3?filename=alexzavesa-calm-inspiring-piano-logo-short-version-518990.mp3"></audio>

    <section>
      <h2>canvas tag</h2>
      <canvas id="myCanvas" width="100" height="50"></canvas>
      <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        ctx.fillRect(0, 0, 100, 50);
      </script>
    </section>

    <section>
      <h2>template tag</h2>
      <template id="myTemp">
        <p>this is inside the template</p>
      </template>
      <p>the template tag above is hidden from view</p>
    </section>
